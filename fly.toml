# Конфігурація Fly.io. Сайт — статичний лендинг, ні бази, ні диска не треба.
app = "psykovalenko"
primary_region = "ams"          # Амстердам

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # адреса підставляється в збірку; після появи домену замініть і задеплойте знову
    NEXT_PUBLIC_SITE_URL = "https://psykovalenko.fly.dev"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
