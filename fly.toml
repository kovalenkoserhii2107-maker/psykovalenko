# Конфігурація Fly.io. Перед першим запуском замініть app на своє ім'я.
app = "psykovalenko"
primary_region = "ams"          # Амстердам — там створено застосунок і диск psy_data

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # адреса підставляється в збірку; після появи домену замініть і задеплойте знову
    NEXT_PUBLIC_SITE_URL = "https://psykovalenko.fly.dev"

[deploy]
  # накочується перед запуском нової версії
  release_command = "node /migrator/node_modules/prisma/build/index.js migrate deploy"

[env]
  PORT = "3000"
  # тека вкладень на постійному диску, інакше файли зникнуть при перезапуску
  UPLOAD_DIR = "/data/uploads"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "psy_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
